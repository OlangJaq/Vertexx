<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertex-Delta Group LTD | Construction & Structural Design — Kenya</title>
    <meta
      name="description"
      content="Vertex-Delta Group LTD is a Kenyan construction and design consultancy delivering residential, commercial, and infrastructure projects. Structural design, architectural plans, project management, and quantity surveying across Kenya."
    />
    <meta name="keywords" content="construction Kenya, structural design Nairobi, architectural plans Kenya, quantity surveying, project management Kenya, EC2 EC3, NCA registered" />
    <meta property="og:title" content="Vertex-Delta Group LTD | Construction & Design Consultancy" />
    <meta property="og:description" content="Precision engineering and considered design across Kenya. Residential, commercial, and infrastructure projects." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vertexx-beta.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        background: #faf8f4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #preloader.hidden { opacity: 0; pointer-events: none; }
      .pre-mark {
        font-family: Georgia, serif;
        font-size: 2rem;
        font-weight: bold;
        color: #1a1a18;
        letter-spacing: 0.05em;
        margin-bottom: 20px;
      }
      .pre-mark span { color: #c8a96e; }
      .pre-spinner {
        width: 36px; height: 36px;
        border: 3px solid #e8e4dc;
        border-top-color: #c8a96e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="pre-mark">V<span>Δ</span></div>
      <div class="pre-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('load', function() {
        var el = document.getElementById('preloader');
        if (el) {
          el.classList.add('hidden');
          setTimeout(function() { el.remove(); }, 500);
        }
      });
    </script>
  </body>
</html>
